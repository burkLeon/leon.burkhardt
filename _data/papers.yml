# Papers, grouped. Groups render in the order given here; empty groups are skipped.
# Items render in file order — keep NEWEST FIRST.
#
# Group fields: id (anchor slug), title, items
# Item fields:
#   key:     amsalpha-style citation label, e.g. "DL24" (author initials + 2-digit year).
#            Shown in brackets before the entry. Omit it and nothing is shown.
#   title:   paper title (inline Markdown allowed)
#   authors: list of names; omit or leave empty for single-author work
#   venue:   journal / conference / institution, may include volume and pages
#   year:    year of publication
#   note:    optional, e.g. "Under revision"
#   links:   optional list of { label, url }
#
# Example:
#   - key: "Doe26"
#     title: "A new bound for *k*-sets"
#     authors: ["Jane Doe"]
#     venue: "Journal of Example Mathematics, 12(3):211–240"
#     year: 2026
#     links:
#       - { label: "arXiv", url: "https://arxiv.org/abs/0000.00000" }

